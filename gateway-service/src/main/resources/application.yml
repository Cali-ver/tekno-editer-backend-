server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "https://tecno-editor-frontend.vercel.app"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/auth/**, /api/users/**
        - id: design-service
          uri: lb://DESIGN-SERVICE
          predicates:
            - Path=/api/designs/**
        - id: media-service
          uri: lb://MEDIA-SERVICE
          predicates:
            - Path=/api/images/**
        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/sms/**, /api/email/**

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

# Custom JWT configuration for the Gateway
app:
  jwt:
    secret: ${JWT_SECRET:canvaCloneSecretKey2024VeryLongSecretKeyForJWTSigning}
