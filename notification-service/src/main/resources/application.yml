server:
  port: 8084

spring:
  application:
    name: notification-service
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:your_email}
    password: ${MAIL_PASSWORD:your_password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

twilio:
  account:
    sid: ${TWILIO_ACCOUNT_SID:ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx}
  auth:
    token: ${TWILIO_AUTH_TOKEN:xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx}
  phone:
    number: ${TWILIO_PHONE_NUMBER:+1234567890}

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

app:
  backend:
    url: ${BACKEND_URL:http://localhost:8080}
